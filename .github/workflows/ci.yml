name: CI

# CI is the compiler. ADR-009: the authoring container has no Android SDK and cannot reach Google's
# Maven, so every Android build claim in this project comes from a run here whose log is readable,
# and the installable APK is downloaded from a run artifact. Nothing is described as "builds"
# because someone wrote it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- data gates
  dataset:
    name: Dataset (anti-fabrication gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the curated dataset
        run: python3 tools/validate_places.py

      - name: Generated assets are not stale
        run: |
          python3 tools/build_app_data.py --check
          python3 tools/build_preview.py --check

      - name: Every itinerary reference resolves
        run: |
          python3 - <<'PY'
          import json, re, sys
          ids = {p["id"] for p in json.load(open("data/places.mumbai.json"))["places"]}
          bad = []
          for doc in ("docs/ITINERARY.md",):
              refs = set(re.findall(r'`([a-z0-9]+(?:-[a-z0-9]+)+)`', open(doc).read()))
              # cluster names appear in backticks too; only flag things shaped like place ids
              # that are neither a known id nor a known cluster.
              clusters = {p["cluster"] for p in json.load(open("data/places.mumbai.json"))["places"]}
              schema = json.load(open("data/schema/place.schema.json"))
              all_clusters = set(schema["properties"]["cluster"]["enum"])
              for r in refs:
                  if r in ids or r in clusters or r in all_clusters:
                      continue
                  if "." in r or "/" in r:
                      continue
                  bad.append(f"{doc}: {r}")
          if bad:
              print("unresolved references:", *bad, sep="\n  ")
              sys.exit(1)
          print("all itinerary references resolve")
          PY

  # ------------------------------------------------------- the testable core
  domain:
    name: ":domain unit tests (JVM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # This job deliberately does NOT set ANDROID_HOME, so settings.gradle.kts excludes :android
      # and this is a genuine test that the module stays Android-free and buildable anywhere.
      - name: Run domain tests
        run: ./gradlew :domain:test --stacktrace

      - name: Assert :domain has zero Android imports
        run: |
          if grep -rnE '^\s*import\s+(android|androidx)\.' domain/src; then
            echo "::error:::domain imported Android. That rule is load-bearing (ADR-009) — it is"
            echo "::error::the only module testable without an SDK. Move this code to :android."
            exit 1
          fi
          echo ":domain is clean of Android imports"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-report
          path: domain/build/reports/tests/test
          retention-days: 14

  # ------------------------------------------------------------ the real APK
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [domain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      # Release is unsigned on purpose: ADR-008 wants a release-signed build for a phone that holds
      # money and location data, and signing it with the debug key would make it release-signed in
      # name only. This step proves R8/shrink works; signing lands when a keystore secret exists.
      - name: Build unsigned release (proves R8 and resource shrinking)
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find android/build/outputs/apk -name '*.apk' | sort); do
            printf '* `%s` — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-release-unsigned-apk
          path: android/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------- the web app
  web:
    name: Web app (installable PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Service worker precache list matches what ships
        run: |
          node - <<'JS'
          const fs = require("fs");
          const sw = fs.readFileSync("web/sw.js", "utf8");
          const listed = [...sw.matchAll(/^\s*"([^"]+)",?$/gm)].map(m => m[1]).filter(p => p !== "./");
          let bad = 0;
          for (const p of listed) {
            if (!fs.existsSync(`web/${p}`)) { console.error(`precached but missing: ${p}`); bad++; }
          }
          const version = sw.match(/const CACHE = "([^"]+)"/);
          if (!version) { console.error("sw.js has no CACHE version"); bad++; }
          else console.log(`cache version: ${version[1]}`);
          if (bad) process.exit(1);
          console.log(`${listed.length} precached files all present`);
          JS

      - name: Syntax-check the app sources
        run: |
          node --check web/app.js
          node --check web/sw.js
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest'))"
          node -e "JSON.parse(require('fs').readFileSync('web/places.json'))"
          node -e "JSON.parse(require('fs').readFileSync('web/trip.json'))"

      - name: Upload the web app
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-web-app
          path: web
          retention-days: 30
