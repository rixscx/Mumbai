org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Required by AGP the moment any AndroidX artifact is on the classpath — which Compose is, entirely.
# Without it `checkDebugAarMetadata` fails before a single Kotlin file is compiled. Ignored by the
# :domain-only build, so it is harmless off an Android machine.
android.useAndroidX=true

# R classes are per-module rather than transitive. AGP 8's default, set explicitly because it
# materially affects build speed and the size of the generated R class as modules are added.
android.nonTransitiveRClass=true

# Jetifier rewrites old support-library artifacts. Nothing here needs it, and leaving it off keeps a
# slow, surprising bytecode rewrite out of the build. If a dependency ever demands it, that is a
# dependency to reconsider rather than a flag to flip.
android.enableJetifier=false
